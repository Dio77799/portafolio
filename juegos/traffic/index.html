<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r126/three.min.js"></script>
    <script defer src="main.js"></script>
    <title>traffic</title>
</head>
<body>
    <div id="score">Presiona ↑</div>

<div id="controls">
  <div id="buttons">
    <button id="accelerate">
      <svg width="30" height="30" viewBox="0 0 10 10">
        <g transform="rotate(0, 5,5)">
          <path d="M5,4 L7,6 L3,6 L5,4" />
        </g>
      </svg>
    </button>
    <button id="decelerate">
      <svg width="30" height="30" viewBox="0 0 10 10">
        <g transform="rotate(180, 5,5)">
          <path d="M5,4 L7,6 L3,6 L5,4" />
        </g>
      </svg>
    </button>
  </div>
  <div id="instructions">
    Presiona ↑ para empezar. Evita chocar con otros vehículos acelerando o frenando con las flechas ↑ y ↓.
  </div>
</div>

<div id="results">
  <div class="content">
    <h1>Chocaste con otro vehículo</h1>
    <p>Presiona R para reiniciar</p>
  </div>
</div>

<span id="youtube-main" style="display:none"></span>
</body>
</html>
